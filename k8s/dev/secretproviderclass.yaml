apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: autocare-api-secrets
  namespace: dev
spec:
  provider: azure
  secretObjects:
    - secretName: autocare-api-secrets
      type: Opaque
      data:
        - objectName: postgres-admin-pass
          key: DATABASE_PASSWORD
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "a665b061-4f43-47df-a1a9-730f873ce2d8"
    keyvaultName: "kv-shared-veltrix"
    tenantId: "4e2f1edd-10d6-41cf-9bee-f86cd168384b"
    objects: |
      array:
        - |
          objectName: postgres-admin-pass
          objectType: secret
