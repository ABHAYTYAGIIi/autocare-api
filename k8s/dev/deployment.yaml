apiVersion: apps/v1
kind: Deployment
metadata:
  name: autocare-api
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autocare-api
  template:
    metadata:
      labels:
        app: autocare-api
      annotations:
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: autocare-api
      containers:
        - name: api
          image: acrazureproject.azurecr.io/autocare-api:v1
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: autocare-api-config
            - secretRef:
                name: autocare-api-secrets
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: autocare-api-secrets
